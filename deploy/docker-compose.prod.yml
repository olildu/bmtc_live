# Runs on oci-arm from ~/dev/bmtc-live:  sudo docker compose -f docker-compose.prod.yml up -d
# .env holds Mappls auth tokens for the signal sidecar (MAPPLS_ACCESS_TOKEN, MAPPLS_REFRESH_TOKEN,
# MAPPLS_UUID, MAPPLS_STATIC_KEY, MAPPLS_APP_FINGERPRINT, MAPPLS_APP_ID, MAPPLS_PAYLOAD_PUB_KEY).
# Updates are automatic: linkup-backend's Watchtower on this host runs with --label-enable and
# recreates any labelled container when a new :latest is pushed to GHCR.
services:
  bmtc-live:
    image: ghcr.io/olildu/bmtc-live:latest
    restart: unless-stopped
    env_file: .env
    ports:
      # The Cloudflare Tunnel routes bmtc.olildu.dpdns.org to host port 8010 (/etc/cloudflared/config.yml).
      - "8010:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
