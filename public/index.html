<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<title>BMTC Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10; --panel: #14171c; --panel2: #1b1f26; --line: #262b33; --line2: #333a45;
    --text: #eef0f3; --muted: #9298a4; --faint: #636b78; --accent: #26b56b; --accent2: #60a5fa; --warn: #f59e0b;
    /* service type + metro line colours used by the Plan trip ribbon */
    --c-walk: #525a68; --c-ord: #1fae63; --c-ac: #2f80ed; --c-air: #6366f1; --c-feeder: #d9922a;
    --c-mp: #9b4fc0; --c-mg: #1fa85a; --c-my: #e6c023;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
  #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  header { padding: 18px 18px 8px; position: relative; }
  h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .field { position: relative; margin: 10px 18px 0; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 5px; }
  .field input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .field input:focus { border-color: var(--accent2); }
  .field .btn-loc { position: absolute; right: 6px; bottom: 6px; border: 0; background: transparent; color: var(--accent2); font: inherit; font-size: 12px; cursor: pointer; padding: 6px 8px; }
  .sugg { position: absolute; z-index: 1000; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: none; }
  .sugg div { padding: 10px 12px; font-size: 13.5px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .sugg div:last-child { border-bottom: 0; }
  .sugg div:hover, .sugg div.active { background: #2a3040; }
  .sugg small { color: var(--muted); display: block; font-size: 11.5px; }
  .hint { margin: 10px 18px 0; font-size: 12px; color: var(--muted); }
  #status { margin: 12px 18px 6px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--accent); box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .toggles { margin: 0 18px 8px; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .toggles input { accent-color: var(--accent); }
  .toggles select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 2px 4px; }
  .tag.walk { color: var(--accent2); border-color: rgba(96,165,250,.4); }
  #routes, #track, #nearby { padding: 4px 12px 18px; }
  .tabs { display: flex; gap: 20px; margin: 12px 18px 2px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: 0; color: var(--faint); font: inherit; font-size: 13.5px; font-weight: 700; padding: 0 0 10px; cursor: pointer; position: relative; }
  .tabs button.on { color: var(--text); }
  .tabs button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); }
  body.mode-route .trip-only, body.mode-nearby .trip-only,
  body:not(.mode-route) .route-only, body:not(.mode-nearby) .nearby-only { display: none !important; }
  .tbus .badge { font-size: 12px; padding: 2px 7px; }
  .nb-to { color: var(--muted); font-size: 12.5px; }
  .tl-row.mine span:first-of-type::after { content: ' · your stop'; color: #4285f4; font-weight: 500; }
  .map-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.5); padding: 0; }
  .map-btn svg { width: 20px; height: 20px; }
  .map-btn.on { color: #4285f4; }
  .tag.ac { color: #22d3ee; border-color: rgba(34,211,238,.4); }
  .tag.fare { color: var(--text); }
  .nightbar { margin: 6px 6px 2px; padding: 10px 12px; border-radius: 10px; background: #1b2236; border: 1px solid #2c3858; font-size: 12.5px; line-height: 1.5; color: var(--text); }
  .nightbar small { color: var(--muted); }
  .idle-toggle { margin: 6px; width: calc(100% - 12px); border: 1px dashed var(--line); background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; padding: 9px; border-radius: 10px; cursor: pointer; }
  .warn { color: var(--warn); }
  .when { display: flex; gap: 8px; margin: 8px 18px 0; }
  .when select, .when input { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; padding: 7px 8px; color-scheme: dark; }
  .when input { flex: 1; min-width: 0; }
  /* journey cards */
  /* Plan trip header (destination-first) */
  .field-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 800; margin: 13px 18px 0; }
  .searchbar { position: relative; display: flex; align-items: center; gap: 11px; margin: 5px 18px 0; }
  .searchbar:focus-within { border-color: var(--accent2); }
  .searchbar .pin { width: 19px; height: 19px; color: #ef4444; flex: none; }
  .searchbar input { flex: 1; min-width: 0; background: 0; border: 0; color: var(--text); font: inherit; font-size: 18px; font-weight: 800; letter-spacing: -.01em; outline: none; }
  .searchbar input::placeholder { color: var(--muted); font-weight: 500; }
  .starbtn { border: 0; background: 0; color: var(--faint); cursor: pointer; padding: 2px; display: grid; place-items: center; }
  .starbtn .ic { width: 18px; height: 18px; }
  .starbtn.saved { color: var(--c-feeder); }
  .fromrow { position: relative; display: flex; align-items: center; gap: 7px; margin: 11px 18px 0; padding-top: 11px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .fromrow .loc { width: 14px; height: 14px; color: var(--accent2); flex: none; }
  .fromrow .lbl { color: var(--faint); }
  .fromrow input { flex: 1; min-width: 0; background: 0; border: 0; color: var(--text); font: inherit; font-size: 13px; font-weight: 600; outline: none; padding: 3px 0; }
  .fromrow input::placeholder { color: var(--text); font-weight: 600; }
  .fromrow .mini { border: 0; background: 0; color: var(--accent2); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; padding: 3px 4px; display: inline-flex; align-items: center; gap: 3px; }
  .fromrow .swapbtn { color: var(--muted); } .fromrow .swapbtn .ic { width: 15px; height: 15px; }
  .chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 11px 18px 2px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; background: 0; border: 1px solid var(--line2); color: var(--text); font: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 0 11px; border-radius: 9px; white-space: nowrap; flex: none; cursor: pointer; }
  .pill .ic { width: 14px; height: 14px; color: var(--muted); }
  .pill .chev { width: 11px; height: 11px; color: var(--faint); margin-left: -2px; }
  .selpill select { background: 0; border: 0; color: var(--text); font: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 0; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; }
  .chip.tog { display: inline-flex; align-items: center; min-height: 32px; border: 1px solid var(--line2); background: transparent; color: var(--muted); font: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 0 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex: none; }
  .chip.tog input { display: none; }
  .chip.tog:has(input:checked) { background: rgba(38,181,107,.14); border-color: rgba(38,181,107,.5); color: #6ee7a8; }
  #whenAt { min-height: 34px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; color: var(--text); font: inherit; font-size: 12.5px; padding: 0 9px; color-scheme: dark; flex: none; }
  .hint:empty { display: none; }
  .chips { gap: 6px; }
  .chip-place { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 999px; cursor: pointer; }
  .chip-place i { font-style: normal; color: var(--muted); } .chip-place i:hover { color: var(--text); }
  .ic { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; flex: none; }
  /* a trip = proportional colour ribbon + arrive/leave + a collapsible step rail */
  .trip { padding: 12px 4px 13px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .trip:last-child { border-bottom: 0; }
  .trip.idle { opacity: .5; }
  .ribbon { display: flex; height: 25px; border-radius: 5px; overflow: hidden; gap: 2px; }
  .seg { display: flex; align-items: center; justify-content: center; min-width: 16px; font-size: 12px; font-weight: 800; white-space: nowrap; padding: 0 7px; gap: 4px; overflow: hidden; transform-origin: left center; }
  .seg .ic { width: 13px; height: 13px; }
  .seg.walk { background: repeating-linear-gradient(115deg, #2a303a 0 5px, #222831 5px 10px); color: var(--muted); font-weight: 700; flex: 0 0 auto; }
  .seg.ord { background: var(--c-ord); color: #06281a; } .seg.ac { background: var(--c-ac); color: #eaf2ff; } .seg.air { background: var(--c-air); color: #eef0ff; }
  .seg.feeder { background: var(--c-feeder); color: #2a1c05; } .seg.mp { background: var(--c-mp); color: #fff; } .seg.mg { background: var(--c-mg); color: #06281a; } .seg.my { background: var(--c-my); color: #2a2405; }
  .trip.build .seg { animation: seg-in .5s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes seg-in { from { transform: scaleX(.03); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  .facts { display: flex; align-items: baseline; margin-top: 9px; }
  .facts .arr { font-size: 21px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .trip.hero .facts .arr { font-size: 26px; color: var(--accent); }
  .facts .arrl { font-size: 10.5px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin: 0 9px 0 7px; align-self: center; }
  .facts .dur { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .facts .right { margin-left: auto; text-align: right; }
  .facts .leave { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); transition: color .3s; }
  .facts .leave.soon { color: var(--c-feeder); }
  .facts .sub { font-size: 10.5px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .tags { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tags .fare { color: var(--text); } .tags .wk { display: inline-flex; align-items: center; gap: 4px; }
  .tags .live { color: var(--accent); display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
  .tags .live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .tags .x { opacity: .35; }
  .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 800; color: var(--faint); margin: 14px 4px 7px; }
  .eyebrow.best { color: var(--accent); }
  .fork { margin: 9px 0 2px; padding: 9px 11px; background: var(--panel); border-left: 3px solid var(--c-mp); border-radius: 0 9px 9px 0; font-size: 12.5px; line-height: 1.45; display: flex; gap: 9px; align-items: center; }
  .fork span { flex: 1; } .fork .ic { color: var(--c-mp); width: 16px; height: 16px; }
  .fork .tbtn { white-space: nowrap; }
  /* expand: ribbon -> vertical rail */
  .detail { display: grid; grid-template-rows: 0fr; overflow: hidden; transition: grid-template-rows .34s cubic-bezier(.2,.7,.2,1); }
  .trip.sel .detail { grid-template-rows: 1fr; margin-top: 12px; }
  .detail > .inner { overflow: hidden; min-height: 0; }
  .leg { display: flex; gap: 12px; }
  .leg .track { width: 22px; flex: none; display: flex; flex-direction: column; align-items: center; }
  .leg .track .cap { width: 22px; height: 22px; border-radius: 50%; background: var(--line); display: grid; place-items: center; color: var(--c-walk); flex: none; }
  .leg .track .cap .ic { width: 13px; height: 13px; }
  .leg .track .bar2 { width: 4px; flex: 1; background: var(--line2); min-height: 20px; border-radius: 2px; margin: 1px 0; }
  .leg:last-child .track .bar2 { display: none; }
  .leg.ord .cap, .leg.ac .cap, .leg.air .cap, .leg.feeder .cap, .leg.mg .cap, .leg.my .cap { color: #06120c; }
  .leg.ord .cap, .leg.ord .bar2 { background: var(--c-ord); } .leg.ac .cap, .leg.ac .bar2 { background: var(--c-ac); } .leg.air .cap, .leg.air .bar2 { background: var(--c-air); } .leg.feeder .cap, .leg.feeder .bar2 { background: var(--c-feeder); }
  .leg.mp .cap, .leg.mp .bar2 { background: var(--c-mp); } .leg.mp .cap { color: #fff; } .leg.mg .cap, .leg.mg .bar2 { background: var(--c-mg); } .leg.my .cap, .leg.my .bar2 { background: var(--c-my); }
  .leg .info { padding: 1px 0 14px; font-size: 13px; line-height: 1.4; }
  .leg .info .h { font-weight: 700; } .leg .info .s { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .leg .time { margin-left: auto; color: var(--muted); font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; }
  .legrow { display: flex; gap: 12px; flex: 1; }
  .leg .tacts { padding-bottom: 4px; }
  .maplink { display: inline-flex; align-items: center; gap: 4px; color: var(--accent2); font-size: 11.5px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .maplink .ic { width: 12px; height: 12px; }
  .maplink:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .trip.build .seg { animation: none; } .detail { transition: none; } }
  /* saved places */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 18px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-size: 12.5px;
    padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .chip.add { color: var(--accent2); }
  .chip i { font-style: normal; color: var(--muted); padding-left: 2px; }
  .chip i:hover { color: var(--text); }
  /* alerts */
  #alertPill { position: fixed; top: 12px; right: 12px; z-index: 1200; display: none; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #alertBox { position: fixed; top: 52px; right: 12px; z-index: 1200; width: min(320px, calc(100vw - 24px)); display: none; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.6); font-size: 13px; }
  #alertBox .arow { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px dashed var(--line); }
  #alertBox .arow span { flex: 1; }
  #alertBox .muted { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); z-index: 1300; max-width: calc(100vw - 32px); background: #2a3040; color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; box-shadow: 0 6px 24px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .bell { border: 0; background: transparent; color: var(--accent2); cursor: pointer; font-size: 15px; padding: 2px 4px; }
  /* metro */
  .mdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--mc); margin-right: 4px; vertical-align: 0; }
  .mpill { font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--mc); color: #fff; }
  .mpill.light { color: #0b0d10; }
  .sched { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); }
  .mdir { font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
  .tl-row[data-stop], .tl-row[data-mstop] { cursor: pointer; }
  /* route tracking */
  .tcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 6px; }
  .tcard.sel { border-color: #3b82f6; }
  .tbtn { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--accent2); font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .tacts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .tacts .tbtn { margin-left: 0; }
  .thead { font-size: 12px; color: var(--muted); margin: 12px 8px 4px; }
  .tbus { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; margin: 0 6px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .tbus:hover { background: var(--panel2); }
  .tbus small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tbus > span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tl { position: relative; margin-top: 10px; }
  .tl::before { content: ''; position: absolute; left: 5px; top: 12px; bottom: 12px; width: 2px; background: var(--line); }
  .tl-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #3b82f6; background: var(--panel2); flex: none; z-index: 1; }
  .tl-row.next .tl-dot { background: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,.25); }
  .tl-row.next span:first-of-type { font-weight: 600; }
  .tl-row span:last-child { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .route { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 6px; cursor: pointer; transition: border-color .15s; }
  .route:hover { border-color: #3a4152; }
  .route.sel { border-color: var(--rc); }
  .route.off { opacity: .45; }
  .rtop { display: flex; align-items: center; gap: 10px; }
  .badge { font-weight: 700; font-size: 14px; padding: 4px 9px; border-radius: 8px; color: #0b0d10; background: var(--rc); white-space: nowrap; }
  .tag { font-size: 10.5px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .tag.direct { color: var(--accent); border-color: rgba(34,197,94,.4); }
  .live-count { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .live-count b { color: var(--text); }
  .rstops { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .rstops b { color: var(--text); font-weight: 500; }
  .buses { margin-top: 8px; display: none; }
  .route.sel .buses { display: block; }
  .bus { font-size: 12.5px; display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px dashed var(--line); }
  .bus span:last-child { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 16px; line-height: 1.6; }
  #map { height: 100%; background: #0b0d10; }
  .leaflet-container { font-family: Inter, system-ui, sans-serif; }
  #side { box-shadow: 2px 0 16px rgba(0,0,0,.4); z-index: 2; }
  .badge { color: #0b0d10; }
  .sugg div:hover, .sugg div.active { background: #2a3040; }
  .leaflet-control-zoom a { background: var(--panel2) !important; color: var(--text) !important; border-color: var(--line) !important; }
  .leaflet-control-attribution { background: rgba(15,17,21,.75) !important; color: var(--muted) !important; font-size: 10px; max-width: 20px; overflow: hidden; white-space: nowrap; cursor: pointer; border-radius: 5px 0 0 0; transition: max-width .2s ease; }
  .leaflet-control-attribution::before { content: 'ⓘ'; margin-right: 5px; color: var(--muted); }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel2); color: var(--text); }
  /* you-are-here */
  .me { width: 22px; height: 22px; border-radius: 50%; background: #4285f4; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); position: relative; }

  .dest { width: 30px; height: 40px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  /* bus marker: centred on the coordinate via translate */
  .bm { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; transition: opacity .3s; }
  .bm-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 2.5px solid #fff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.55); position: relative; z-index: 1; }
  .bm-dot svg { width: 16px; height: 16px; fill: #fff; }
  .bm-dir { position: absolute; top: 0; left: 50%; width: 30px; height: 30px; margin-left: -15px; }
  .bm-dir i { position: absolute; left: 50%; top: -9px; margin-left: -6px; border: 6px solid transparent; border-bottom: 9px solid var(--c); filter: drop-shadow(0 -1px 0 #fff); }
  .bm-tag { position: absolute; top: 33px; white-space: nowrap; font-size: 10.5px; font-weight: 700; color: #fff; background: rgba(11,13,16,.85); border: 1px solid var(--c); padding: 1px 6px; border-radius: 6px; line-height: 1.4; }
  .bm.halted .bm-dot { border-color: #f59e0b; }
  .bm.passed { opacity: .35; }
  .bm.passed .bm-tag { display: none; }
  /* schedule-simulated metro ridership factoid */
  .ride { font-size: 11.5px; color: var(--muted); padding: 2px 2px 8px; display: flex; align-items: center; gap: 6px; }

  .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; }

  .grip { display: none; }
  /* phones: full-screen map with a draggable bottom sheet (peek / half / full) */

    html, body { overscroll-behavior: none; }

    #side { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; border-right: 0; border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.5); z-index: 1000; transition: height .25s ease; padding-bottom: env(safe-area-inset-bottom); }
    #side.dragging { transition: none; }
    .grip { display: block; padding: 8px 0 2px; touch-action: none; cursor: grab; position: sticky; top: 0; background: var(--panel); z-index: 5; }

    .chips, .when { margin-left: 16px; margin-right: 16px; }

    #toast { bottom: calc(var(--sheet-h, 0px) + 16px); }
    .field { margin-top: 8px; }

    .field input { font-size: 16px; padding: 10px 12px; } /* 16px stops iOS zooming on focus */
    .field .btn-loc { bottom: 4px; padding: 8px 10px; }
    #status { margin-top: 10px; }
    .hint { order: 1; margin-top: 0; margin-bottom: 4px; }
    #routes, #track, #nearby { order: 2; padding: 0 10px 12px; }

    .leaflet-bottom { bottom: var(--sheet-h, 0); transition: bottom .25s ease; }
  }
  /* guided walkthrough */
  #tourBtn { position: absolute; top: 16px; right: 14px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel2); color: var(--muted); font: 700 13px Inter, sans-serif; cursor: pointer; display: grid; place-items: center; line-height: 1; padding: 0; z-index: 2; }
  #tourBtn:hover { color: var(--text); border-color: var(--accent); }
  #tour { position: fixed; inset: 0; z-index: 3000; display: none; }
  #tour.on { display: block; }
  #tour.no-spot { background: rgba(4,6,9,.64); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  #tourSpot { position: absolute; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(4,6,9,.66); outline: 2px solid var(--accent); outline-offset: 3px; pointer-events: none; transition: all .3s cubic-bezier(.4,0,.2,1); }
  #tour.no-spot #tourSpot { display: none; }
  .tour-card { position: absolute; width: min(336px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 15px 16px 13px; box-shadow: 0 16px 50px rgba(0,0,0,.6); transition: top .28s ease, left .28s ease; animation: tfade .2s ease; }
  @keyframes tfade { from { opacity: 0; } }
  #tour.no-spot .tour-card { top: 50% !important; left: 50% !important; transform: translate(-50%, -50%); width: min(400px, calc(100vw - 32px)); padding: 24px 22px 18px; }
  .tour-skip { position: absolute; top: 12px; right: 14px; border: 0; background: 0; color: var(--faint); font: 600 12px Inter, sans-serif; cursor: pointer; }

<script>
const COLORS = ['#22c55e','#3b82f6','#f59e0b','#ec4899','#a855f7','#14b8a6','#ef4444','#eab308','#06b6d4','#f97316','#84cc16','#8b5cf6'];
const BLR = [12.9716, 77.5946];
const $ = id => document.getElementById(id);
const mq = matchMedia('(max-width: 760px)');

const map = L.map('map', { zoomControl: false }).setView(BLR, 12);
L.control.zoom({ position: 'bottomright' }).addTo(map);
setTimeout(() => { const a = document.querySelector('.leaflet-control-attribution'); if (a) a.addEventListener('click', e => { if (!e.target.closest('a')) a.classList.toggle('show'); }); }, 500);
const glLayer = L.maplibreGL({
  style: 'https://tiles.openfreemap.org/styles/dark',
  attribution: '&copy; OpenFreeMap &copy; OpenStreetMap · Metro timetable: BMRCL via Vonter/bmrcl-gtfs (ODbL)',
}).addTo(map);

const state = { from: null, to: null, when: { mode: 'now' }, options: [], sel: null, branch: {}, es: null, refs: new Set(), vehicles: new Map(), etas: new Map(), stopLists: new Map(), night: false, showIdle: false, liveSince: null };
const layers = { lines: L.layerGroup().addTo(map), stops: L.layerGroup().addTo(map), buses: L.layerGroup().addTo(map), pins: L.layerGroup().addTo(map) };
const busMarkers = new Map();

const meIcon = L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
const startIcon = L.divIcon({ className: '', html: '<div class="start"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
const destIcon = L.divIcon({ className: '', iconSize: [30, 40], iconAnchor: [15, 38],
  html: '<svg class="dest" viewBox="0 0 30 40"><path d="M15 1C7.3 1 1 7.2 1 14.9 1 25.4 15 39 15 39s14-13.6 14-24.1C29 7.2 22.7 1 15 1z" fill="#ea4335" stroke="#a50e0e" stroke-width="1.5"/><circle cx="15" cy="15" r="5.5" fill="#7a0c0c"/></svg>' });
const busSvg = '<svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 001 1h1a1 1 0 001-1v-1h8v1a1 1 0 001 1h1a1 1 0 001-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm9 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zM18 11H6V6h12v5z"/></svg>';
// round badge in the route colour + a heading arrow that rotates with the bus, route number tag underneath
const busIcon = (c, name, bearing, passed, halted) => L.divIcon({ className: '', iconSize: [0, 0], iconAnchor: [0, 0],
  html: `<div class="bm${passed ? ' passed' : ''}${halted ? ' halted' : ''}" style="--c:${c}">
    ${bearing != null ? `<div class="bm-dir" style="transform:rotate(${bearing}deg)"><i></i></div>` : ''}
    <div class="bm-dot">${busSvg}</div><div class="bm-tag">${name}</div></div>` });

function setStatus(text, mode) {
  $('statusText').innerHTML = text;
  $('dot').className = 'dot' + (mode === 'live' ? ' live' : '');
  if (mode === 'loading') $('dot').outerHTML = '<span class="spinner" id="dot"></span>';
  else if ($('dot').classList.contains('spinner')) $('dot').outerHTML = `<span class="dot${mode === 'live' ? ' live' : ''}" id="dot"></span>`;
}

// --- small shared helpers ---
// BMTC service type from Chalo's tags (there's no crowding data in the feed)
function serviceTags(tags = [], name = '') {
  const out = [];
  if (tags.includes('Vayu Vajra')) out.push(['AC · Airport', 'ac']);
  else if (tags.includes('Vajra')) out.push(['AC', 'ac']);
  else if (tags.includes('Ordinary')) out.push(['Non-AC', '']);
  if (/^MF-/i.test(name)) out.push(['Metro feeder', '']);
  for (const t of tags) if (!['Vayu Vajra', 'Vajra', 'Ordinary'].includes(t)) out.push([t, '']);
  return out.map(([t, c]) => `<span class="tag ${c}">${t}</span>`).join('');
}
const serviceText = (tags = []) => tags.includes('Vayu Vajra') ? ' · AC Airport' : tags.includes('Vajra') ? ' · AC' : '';
const fmtClock = sec => { const m = Math.floor(((sec % 86400) + 86400) % 86400 / 60); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// saved places and favourite routes live in this browser only
const saved = (() => { try { return { places: [], routes: [], alertMins: 5, ...JSON.parse(localStorage.getItem('bmtc.saved') || '{}') }; } catch { return { places: [], routes: [], alertMins: 5 }; } })();
function persist() { try { localStorage.setItem('bmtc.saved', JSON.stringify(saved)); } catch {} }

let toastT;
function toast(text, ms = 4000) {
  const t = $('toast'); t.innerHTML = text; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

// --- alerts: "tell me when the bus is N min away" / "remind me before the train" ---
// Live alerts use their own socket subscriptions, so they keep working when you switch tabs. The page must stay open.
const alerts = { list: [], sock: null, refs: new Set(), seq: 0 };
function addAlert(a) {
  a.id = ++alerts.seq; a.mins = saved.alertMins;
  if (a.kind === 'scheduled') {
    const ms = (a.at - a.mins * 60) * 1000 - Date.now();
    if (ms <= 0) return toast('That train leaves in under ' + a.mins + ' min. Head out now!');
    a.timer = setTimeout(() => fireAlert(a, `${a.label} leaves in ${a.mins} min`), ms);
  }
  alerts.list.push(a);
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch {}
  syncAlertSock(); renderAlerts();
  toast(`🔔 We'll alert you ${a.mins} min before: ${esc(a.label)}.<br><small>Keep this page open.</small>`);
}
function removeAlert(id) {

// live subscriptions = every nearby route + whatever the open views need, diffed against what's subscribed
function syncNearRefs() {

  if (near.center) for (const v of near.vehicles.values()) if (near.routes.has(v.routeId) && map.distance(near.center, [v.lat, v.lon]) <= R) live.add(v.routeId);
  for (const r of near.routes.values()) { want.add('routes:' + r.routeId); if (live.has(r.routeId)) want.add(`etas:${r.stop.id}:${r.routeId}`); }
  for (const sel of near.stack) {
    if (sel.type === 'stop') for (const r of sel.routes || []) want.add('routes:' + r.routeId).add(`etas:${r.stop.id}:${r.routeId}`);
    if (sel.type === 'bus' && sel.route) {

async function selectNearBus(routeId, key) {

  const sel = { type: 'bus', id, routeId, key, route: near.details.get(routeId) || null };
  pushSel(sel);
  if (sel.route) return;
  try {
    const r = await (await fetch(`/api/route?id=${encodeURIComponent(routeId)}`)).json();
    if (r.error) throw new Error(r.error);
    r.idx = new Map(r.stops.map((st, k) => [st.id, k]));

else restoreTrip(); // bring back the last destination on refresh

// ---- guided walkthrough: a spotlight that steps through each real control (first visit; replay from the "?" button) ----
// Each step switches to the right tab, highlights an actual element, and anchors a callout beside it.
const TOUR = [
  { mode: 'trip', title: 'Welcome to BMTC Live', body: 'Find any BMTC bus to where you\'re going — moving <b>live on a map</b> — plus Namma Metro. This quick tour points out everything. Skip anytime.' },
  { mode: 'trip', sel: '.tabs', title: 'Three ways in', body: '<b>Plan trip</b> for a full journey, <b>Track route</b> to follow a route number, and <b>Nearby</b> for what\'s around you. I\'ll walk through each.' },
  { mode: 'trip', sel: '#toField', title: 'Set your destination', body: 'Type where you\'re going here, or tap the map. Your start is your location by default — type it under <b>from</b>, or long-press / shift-click the map. Save places with the <b>star</b>.' },
  { mode: 'trip', sel: '.chiprow', title: 'Rank it your way', body: 'Order results by <b>Fastest</b>, <b>Least walking</b> or <b>Cheapest</b>, set <b>Leave at</b> / <b>Arrive by</b>, and flip on <b>2 buses</b> for trips with a transfer.' },
  { mode: 'trip', sel: '#routes', title: 'Every way, ranked by arrival', body: 'Options appear here ordered by <b>when you\'d actually arrive</b> from live buses — one bus, bus + metro, or metro. Open one for a step-by-step timeline; the map draws your walk, the live bus and <b>moving metro</b>.' },
  { mode: 'route', sel: '.field.route-only', title: 'Track a route', body: 'Know the number? Search it to see the <b>whole route</b> and <b>every live bus</b> on it. Tap a bus to follow it, with upcoming stops and ETAs.' },
  { mode: 'nearby', sel: '.toggles', title: 'Nearby', body: '<b>Live buses around you</b>, nearest first, within 500 m – 2 km. Plus <b>live metro trains</b> gliding on the lines and today\'s metro ridership. Tap a bus, stop or train to open it.' },
  { mode: 'nearby', sel: '#map', title: 'Live on the map', body: 'Buses, your walking path and metro trains all move in real time. Tap <b>Notify me</b> on any bus, stop or train to get pinged before it arrives (keep the tab open).' },
  { mode: 'trip', sel: '#tourBtn', title: 'You\'re all set', body: 'Pick a destination to begin — and replay this tour anytime from here.' },
];
let tourI = 0;
const tclamp = (v, a, b) => Math.max(a, Math.min(b, v));
function positionTour(el) {
  const spot = $('tourSpot'), card = $('tourCard'), r = el.getBoundingClientRect(), pad = 6;
  spot.style.cssText = `position:absolute;left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`;
  const cw = card.offsetWidth, ch = card.offsetHeight, vw = innerWidth, vh = innerHeight, m = 12;
  let left, top;
  if (r.right + m + cw <= vw - m) { left = r.right + m; top = tclamp(r.top, m, vh - ch - m); }                      // beside, over the map
  else if (r.bottom + m + ch <= vh - m) { top = r.bottom + m; left = tclamp(r.left + r.width / 2 - cw / 2, m, vw - cw - m); } // below
  else if (r.top - m - ch >= m) { top = r.top - m - ch; left = tclamp(r.left + r.width / 2 - cw / 2, m, vw - cw - m); }       // above
  else { left = tclamp(r.left + r.width / 2 - cw / 2, m, vw - cw - m); top = vh - ch - m; }                            // pinned to the bottom
  card.style.left = left + 'px'; card.style.top = top + 'px';
}
function layoutTour() {
  const s = TOUR[tourI], el = s.sel && document.querySelector(s.sel), t = $('tour');
  if (!el) { t.classList.add('no-spot'); return; }
  t.classList.remove('no-spot');
  if (mq.matches) setSheet(s.sel === '#map' ? 'peek' : 'full'); // mobile: reveal the sheet control, or the map
  requestAnimationFrame(() => {
    try { if (s.sel !== '#map') el.scrollIntoView({ block: 'center' }); } catch {}
    setTimeout(() => { if ($('tour').classList.contains('on')) positionTour(el); }, mq.matches ? 200 : 40);
  });
}
function renderTour() {
  const s = TOUR[tourI];
  if (s.mode && s.mode !== mode) setMode(s.mode);
  $('tourStep').textContent = `Step ${tourI + 1} of ${TOUR.length}`;
  $('tourTitle').textContent = s.title;
  $('tourBody').innerHTML = s.body;
  $('tourDots').innerHTML = TOUR.map((_, i) => `<i class="${i === tourI ? 'on' : ''}"></i>`).join('');
  $('tourBack').disabled = tourI === 0;
  $('tourNext').textContent = tourI === TOUR.length - 1 ? 'Done' : 'Next';
  layoutTour();
}
function openTour(i = 0) { tourI = i; const t = $('tour'); t.classList.add('on'); t.setAttribute('aria-hidden', 'false'); renderTour(); }
function closeTour() { const t = $('tour'); t.classList.remove('on'); t.setAttribute('aria-hidden', 'true'); try { localStorage.setItem('bmtc.tour', '1'); } catch {} }
const tourNext = () => tourI >= TOUR.length - 1 ? closeTour() : (tourI++, renderTour());
const tourBack = () => { if (tourI > 0) { tourI--; renderTour(); } };
const tourOpen = () => $('tour').classList.contains('on');
$('tourBtn').onclick = () => openTour(0);
$('tourSkip').onclick = closeTour;
$('tourNext').onclick = tourNext;
$('tourBack').onclick = tourBack;
addEventListener('resize', () => { if (tourOpen()) layoutTour(); });
$('side').addEventListener('scroll', () => { const el = tourOpen() && TOUR[tourI].sel && document.querySelector(TOUR[tourI].sel); if (el) positionTour(el); });
addEventListener('keydown', e => {
  if (!tourOpen()) return;
  if (e.key === 'Escape') closeTour();
  else if (e.key === 'ArrowRight' || e.key === 'Enter') tourNext();
  else if (e.key === 'ArrowLeft') tourBack();
});
try { if (!hashRoute && !localStorage.getItem('bmtc.tour')) setTimeout(() => openTour(0), 700); } catch {}
</script>
</body>
</html>
