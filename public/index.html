<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171a21">
<title>BMTC Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1f232c; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #8b93a5; --accent: #22c55e; --accent2: #60a5fa; --warn: #f59e0b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
  #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 18px 18px 8px; }
  h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .field { position: relative; margin: 10px 18px 0; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 5px; }
  .field input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .field input:focus { border-color: var(--accent2); }
  .field .btn-loc { position: absolute; right: 6px; bottom: 6px; border: 0; background: transparent; color: var(--accent2); font: inherit; font-size: 12px; cursor: pointer; padding: 6px 8px; }
  .sugg { position: absolute; z-index: 1000; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: none; }
  .sugg div { padding: 10px 12px; font-size: 13.5px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .sugg div:last-child { border-bottom: 0; }
  .sugg div:hover, .sugg div.active { background: #2a3040; }
  .sugg small { color: var(--muted); display: block; font-size: 11.5px; }
  .hint { margin: 10px 18px 0; font-size: 12px; color: var(--muted); }
  #status { margin: 12px 18px 6px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--accent); box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .toggles { margin: 0 18px 8px; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .toggles input { accent-color: var(--accent); }
  .toggles select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; padding: 2px 4px; }
  .tag.walk { color: var(--accent2); border-color: rgba(96,165,250,.4); }
  #routes, #track, #nearby { overflow-y: auto; padding: 4px 12px 18px; flex: 1; min-height: 0; }
  .tabs { display: flex; gap: 3px; margin: 12px 18px 2px; padding: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; }
  .tabs button { flex: 1; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 8px; cursor: pointer; }
  .tabs button.on { background: #2a3040; color: var(--text); }
  body.mode-route .trip-only, body.mode-nearby .trip-only,
  body:not(.mode-route) .route-only, body:not(.mode-nearby) .nearby-only { display: none !important; }
  .tbus .badge { font-size: 12px; padding: 2px 7px; }
  .nb-to { color: var(--muted); font-size: 12.5px; }
  .tl-row.mine span:first-of-type::after { content: ' · your stop'; color: #4285f4; font-weight: 500; }
  .map-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.5); padding: 0; }
  .map-btn svg { width: 20px; height: 20px; }
  .map-btn.on { color: #4285f4; }
  .tag.ac { color: #22d3ee; border-color: rgba(34,211,238,.4); }
  .tag.fare { color: var(--text); }
  /* saved places */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 18px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; font-size: 12.5px;
    padding: 5px 10px; border-radius: 999px; cursor: pointer; }
  .chip.add { color: var(--accent2); }
  .chip i { font-style: normal; color: var(--muted); padding-left: 2px; }
  .chip i:hover { color: var(--text); }
  /* alerts */
  #alertPill { position: fixed; top: 12px; right: 12px; z-index: 1200; display: none; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #alertBox { position: fixed; top: 52px; right: 12px; z-index: 1200; width: min(320px, calc(100vw - 24px)); display: none; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.6); font-size: 13px; }
  #alertBox .arow { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px dashed var(--line); }
  #alertBox .arow span { flex: 1; }
  #alertBox .muted { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); z-index: 1300; max-width: calc(100vw - 32px); background: #2a3040; color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; box-shadow: 0 6px 24px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  .bell { border: 0; background: transparent; color: var(--accent2); cursor: pointer; font-size: 15px; padding: 2px 4px; }
  /* metro */
  .mdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--mc); margin-right: 4px; vertical-align: 0; }
  .mpill { font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--mc); color: #fff; }
  .mpill.light { color: #0b0d10; }
  .sched { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); }
  .mdir { font-size: 12px; color: var(--muted); margin: 10px 0 2px; }
  .tl-row[data-stop], .tl-row[data-mstop] { cursor: pointer; }
  /* route tracking */
  .tcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 6px; }
  .tcard.sel { border-color: #3b82f6; }
  .tbtn { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--accent2); font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .tacts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .tacts .tbtn { margin-left: 0; }
  .thead { font-size: 12px; color: var(--muted); margin: 12px 8px 4px; }
  .tbus { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; margin: 0 6px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .tbus:hover { background: var(--panel2); }
  .tbus small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tbus > span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tl { position: relative; margin-top: 10px; }
  .tl::before { content: ''; position: absolute; left: 5px; top: 12px; bottom: 12px; width: 2px; background: var(--line); }
  .tl-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #3b82f6; background: var(--panel2); flex: none; z-index: 1; }
  .tl-row.next .tl-dot { background: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,.25); }
  .tl-row.next span:first-of-type { font-weight: 600; }
  .tl-row span:last-child { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .route { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 6px; cursor: pointer; transition: border-color .15s; }
  .route:hover { border-color: #3a4152; }
  .route.sel { border-color: var(--rc); }
  .route.off { opacity: .45; }
  .rtop { display: flex; align-items: center; gap: 10px; }
  .badge { font-weight: 700; font-size: 14px; padding: 4px 9px; border-radius: 8px; color: #0b0d10; background: var(--rc); white-space: nowrap; }
  .tag { font-size: 10.5px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .tag.direct { color: var(--accent); border-color: rgba(34,197,94,.4); }
  .live-count { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .live-count b { color: var(--text); }
  .rstops { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .rstops b { color: var(--text); font-weight: 500; }
  .buses { margin-top: 8px; display: none; }
  .route.sel .buses { display: block; }
  .bus { font-size: 12.5px; display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px dashed var(--line); }
  .bus span:last-child { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 16px; line-height: 1.6; }
  #map { height: 100%; background: #0b0d10; }
  .leaflet-container { font-family: Inter, system-ui, sans-serif; }
  #side { box-shadow: 2px 0 16px rgba(0,0,0,.4); z-index: 2; }
  .badge { color: #0b0d10; }
  .sugg div:hover, .sugg div.active { background: #2a3040; }
  .leaflet-control-zoom a { background: var(--panel2) !important; color: var(--text) !important; border-color: var(--line) !important; }
  .leaflet-control-attribution { background: rgba(15,17,21,.7) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .leaflet-tooltip { background: var(--panel2); color: var(--text); border-color: var(--line); }


  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel2); color: var(--text); }
  /* you-are-here */
  .me { width: 22px; height: 22px; border-radius: 50%; background: #4285f4; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); position: relative; }
  .me::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; animation: mepulse 2s ease-out infinite; }
  @keyframes mepulse { 0% { box-shadow: 0 0 0 0 rgba(66,133,244,.55); } 100% { box-shadow: 0 0 0 18px rgba(66,133,244,0); } }
  .start { width: 18px; height: 18px; border-radius: 50%; background: #0b0d10; border: 4px solid #4285f4; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .dest { width: 30px; height: 40px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  /* bus marker: centred on the coordinate via translate */
  .bm { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; transition: opacity .3s; }
  .bm-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 2.5px solid #fff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.55); position: relative; z-index: 1; }
  .bm-dot svg { width: 16px; height: 16px; fill: #fff; }
  .bm-dir { position: absolute; top: 0; left: 50%; width: 30px; height: 30px; margin-left: -15px; }
  .bm-dir i { position: absolute; left: 50%; top: -9px; margin-left: -6px; border: 6px solid transparent; border-bottom: 9px solid var(--c); filter: drop-shadow(0 -1px 0 #fff); }
  .bm-tag { position: absolute; top: 33px; white-space: nowrap; font-size: 10.5px; font-weight: 700; color: #fff; background: rgba(11,13,16,.85); border: 1px solid var(--c); padding: 1px 6px; border-radius: 6px; line-height: 1.4; }
  .bm.halted .bm-dot { border-color: #f59e0b; }
  .bm.passed { opacity: .35; }
  .bm.passed .bm-tag { display: none; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grip { display: none; }
  /* phones: full-screen map with a draggable bottom sheet (peek / half / full) */
  @media (max-width: 760px) {
    html, body { overscroll-behavior: none; }
    #app { display: block; position: relative; height: 100dvh; }
    #map { position: absolute; inset: 0; }
    #side { position: absolute; left: 0; right: 0; bottom: 0; height: 240px; overflow: hidden; border-right: 0; border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.5); z-index: 1000; transition: height .25s ease; padding-bottom: env(safe-area-inset-bottom); }
    #side.dragging { transition: none; }
    .grip { display: block; padding: 8px 0 2px; touch-action: none; cursor: grab; }
    .grip::before { content: ''; display: block; width: 36px; height: 4px; border-radius: 2px; background: #4a5162; margin: 0 auto; }
    header { padding: 2px 16px 0; touch-action: none; }
    .sub { display: none; }
    .field, .hint, #status, .toggles, .tabs { margin-left: 16px; margin-right: 16px; }
    .tabs { margin-top: 6px; }
    .chips { margin-left: 16px; margin-right: 16px; }
    #toast { bottom: calc(var(--sheet-h, 0px) + 16px); }
    .field { margin-top: 8px; }
    .field label { margin-bottom: 4px; }
    .field input { font-size: 16px; padding: 10px 12px; } /* 16px stops iOS zooming on focus */
    .field .btn-loc { bottom: 4px; padding: 8px 10px; }
    #status { margin-top: 10px; }
    .hint { order: 1; margin-top: 0; margin-bottom: 4px; }
    #routes, #track, #nearby { order: 2; padding: 0 10px 12px; }
    .toggles { flex-wrap: wrap; gap: 4px 16px; }
    .toggles label { padding: 6px 0; }
    .route { margin: 8px 4px; }
    .leaflet-control-zoom { display: none; }
    .leaflet-bottom { bottom: var(--sheet-h, 0); transition: bottom .25s ease; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="grip" id="grip"></div>
    <header>
      <h1>BMTC <span>Live</span></h1>
      <div class="sub">Plan a trip or track any route. Every bus, live.</div>
    </header>
    <div class="tabs"><button id="tabTrip" class="on">Plan trip</button><button id="tabRoute">Track route</button><button id="tabNearby">Nearby</button></div>
    <div class="field trip-only">
      <label>From</label>
      <input id="from" placeholder="Your location" autocomplete="off">
      <button class="btn-loc" id="locBtn" title="Use my location">◎ Locate</button>
      <div class="sugg" id="fromSugg"></div>
    </div>
    <div class="field trip-only">
      <label>To</label>
      <input id="to" placeholder="Where are you going?" autocomplete="off">
      <div class="sugg" id="toSugg"></div>
    </div>
    <div class="chips trip-only" id="chips"></div>
    <div class="field route-only">
      <label>Route</label>
      <input id="routeQ" placeholder="Route number, e.g. 500-D" autocomplete="off" autocapitalize="characters">
      <div class="sugg" id="routeSugg"></div>
    </div>
    <div class="hint trip-only" id="hint">Tip: click the map to set the destination, shift+click to set the start.</div>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">Set a destination to begin</span></div>
    <div class="toggles trip-only">
      <label><input type="checkbox" id="onlyDirect"> Direct only</label>
      <label>Walk up to <select id="maxWalk"><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option><option value="25" selected>25 min</option><option value="999">any</option></select></label>
      <label><input type="checkbox" id="hidePassed" checked> Hide buses that passed your stop</label>
    </div>
    <div id="routes" class="trip-only"><div class="empty">No destination yet.<br>Search above or click on the map.</div></div>
    <div id="track" class="route-only"></div>
    <div class="toggles nearby-only">
      <label>Show buses within <select id="radius"><option value="500">500 m</option><option value="1000" selected>1 km</option><option value="2000">2 km</option></select> of you</label>
    </div>
    <div id="nearby" class="nearby-only"></div>
  </aside>
  <div id="map"></div>
</div>
<button id="alertPill" title="Your alerts"></button>
<div id="alertBox"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@2.5.0/dist/socket.io.js"></script>
<script>
const COLORS = ['#22c55e','#3b82f6','#f59e0b','#ec4899','#a855f7','#14b8a6','#ef4444','#eab308','#06b6d4','#f97316','#84cc16','#8b5cf6'];
const BLR = [12.9716, 77.5946];
const $ = id => document.getElementById(id);
const mq = matchMedia('(max-width: 760px)');

const map = L.map('map', { zoomControl: false }).setView(BLR, 12);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.maplibreGL({
  style: 'https://tiles.openfreemap.org/styles/dark',
  attribution: '&copy; OpenFreeMap &copy; OpenStreetMap · Metro timetable: BMRCL via Vonter/bmrcl-gtfs (ODbL)',
}).addTo(map);

const state = { from: null, to: null, routes: [], selected: null, es: null, vehicles: new Map(), etas: new Map() };
const layers = { lines: L.layerGroup().addTo(map), stops: L.layerGroup().addTo(map), buses: L.layerGroup().addTo(map), pins: L.layerGroup().addTo(map) };
const busMarkers = new Map();

const meIcon = L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
const startIcon = L.divIcon({ className: '', html: '<div class="start"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
const destIcon = L.divIcon({ className: '', iconSize: [30, 40], iconAnchor: [15, 38],
  html: '<svg class="dest" viewBox="0 0 30 40"><path d="M15 1C7.3 1 1 7.2 1 14.9 1 25.4 15 39 15 39s14-13.6 14-24.1C29 7.2 22.7 1 15 1z" fill="#ea4335" stroke="#a50e0e" stroke-width="1.5"/><circle cx="15" cy="15" r="5.5" fill="#7a0c0c"/></svg>' });
const busSvg = '<svg viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20a1 1 0 001 1h1a1 1 0 001-1v-1h8v1a1 1 0 001 1h1a1 1 0 001-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm9 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zM18 11H6V6h12v5z"/></svg>';
// round badge in the route colour + a heading arrow that rotates with the bus, route number tag underneath
const busIcon = (c, name, bearing, passed, halted) => L.divIcon({ className: '', iconSize: [0, 0], iconAnchor: [0, 0],
  html: `<div class="bm${passed ? ' passed' : ''}${halted ? ' halted' : ''}" style="--c:${c}">
    ${bearing != null ? `<div class="bm-dir" style="transform:rotate(${bearing}deg)"><i></i></div>` : ''}
    <div class="bm-dot">${busSvg}</div><div class="bm-tag">${name}</div></div>` });

function setStatus(text, mode) {
  $('statusText').innerHTML = text;
  $('dot').className = 'dot' + (mode === 'live' ? ' live' : '');
  if (mode === 'loading') $('dot').outerHTML = '<span class="spinner" id="dot"></span>';
  else if ($('dot').classList.contains('spinner')) $('dot').outerHTML = `<span class="dot${mode === 'live' ? ' live' : ''}" id="dot"></span>`;
}

// --- small shared helpers ---
// BMTC service type from Chalo's tags (there's no crowding data in the feed)
function serviceTags(tags = [], name = '') {
  const out = [];
  if (tags.includes('Vayu Vajra')) out.push(['AC · Airport', 'ac']);
  else if (tags.includes('Vajra')) out.push(['AC', 'ac']);
  else if (tags.includes('Ordinary')) out.push(['Non-AC', '']);
  if (/^MF-/i.test(name)) out.push(['Metro feeder', '']);
  for (const t of tags) if (!['Vayu Vajra', 'Vajra', 'Ordinary'].includes(t)) out.push([t, '']);
  return out.map(([t, c]) => `<span class="tag ${c}">${t}</span>`).join('');
}
const serviceText = (tags = []) => tags.includes('Vayu Vajra') ? ' · AC Airport' : tags.includes('Vajra') ? ' · AC' : '';
const fmtClock = sec => { const m = Math.floor(((sec % 86400) + 86400) % 86400 / 60); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// saved places and favourite routes live in this browser only
const saved = (() => { try { return { places: [], routes: [], alertMins: 5, ...JSON.parse(localStorage.getItem('bmtc.saved') || '{}') }; } catch { return { places: [], routes: [], alertMins: 5 }; } })();
function persist() { try { localStorage.setItem('bmtc.saved', JSON.stringify(saved)); } catch {} }

let toastT;
function toast(text, ms = 4000) {
  const t = $('toast'); t.innerHTML = text; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

// --- alerts: "tell me when the bus is N min away" / "remind me before the train" ---
// Live alerts use their own socket subscriptions, so they keep working when you switch tabs. The page must stay open.
const alerts = { list: [], sock: null, refs: new Set(), seq: 0 };
function addAlert(a) {
  a.id = ++alerts.seq; a.mins = saved.alertMins;
  if (a.kind === 'scheduled') {
    const ms = (a.at - a.mins * 60) * 1000 - Date.now();
    if (ms <= 0) return toast('That train leaves in under ' + a.mins + ' min. Head out now!');
    a.timer = setTimeout(() => fireAlert(a, `${a.label} leaves in ${a.mins} min`), ms);
  }
  alerts.list.push(a);
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch {}
  syncAlertSock(); renderAlerts();
  toast(`🔔 We'll alert you ${a.mins} min before: ${esc(a.label)}.<br><small>Keep this page open.</small>`);
}
function removeAlert(id) {
  const a = alerts.list.find(x => x.id === id);
  if (a?.timer) clearTimeout(a.timer);
  alerts.list = alerts.list.filter(x => x.id !== id);
  syncAlertSock(); renderAlerts();
}
function fireAlert(a, text) {
  removeAlert(a.id);
  toast('🔔 ' + esc(text), 10000);
  navigator.vibrate?.([250, 120, 250]);
  try { // a short two-tone beep
    const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); g.gain.value = .15; o.frequency.value = 880; o.start();
    setTimeout(() => o.frequency.value = 1175, 180); setTimeout(() => { o.stop(); ac.close(); }, 420);
  } catch {}
  try { if (Notification.permission === 'granted') new Notification('BMTC Live', { body: text }); } catch {}
}
function syncAlertSock() {
  const want = new Set(alerts.list.filter(a => a.kind === 'live').map(a => `etas:${a.stopId}:${a.routeId}`));
  if (!want.size) { if (alerts.sock) { alerts.sock.close(); alerts.sock = null; } alerts.refs.clear(); return; }
  for (const ref of [...alerts.refs]) if (!want.has(ref)) { alerts.refs.delete(ref); alerts.sock?.emit('unsubscribe', JSON.stringify({ ref })); }
  for (const ref of want) if (!alerts.refs.has(ref)) { alerts.refs.add(ref); if (alerts.sock?.connected) alerts.sock.emit('subscribe', JSON.stringify({ ref })); }
  if (!alerts.sock) alerts.sock = liveSocket(alerts.refs, (parts, key, d) => {
    if (parts[0] !== 'etas' || !(d.eta >= 0)) return;
    for (const a of [...alerts.list]) if (a.kind === 'live' && a.stopId === parts[1] && a.routeId === parts[2] && (!a.key || a.key === key) && d.eta <= a.mins * 60)
      fireAlert(a, `${a.label}: ${d.vNo || 'bus'} ${fmtEta(d.eta) === 'arriving now' ? 'is arriving now' : 'in ' + fmtEta(d.eta)}`);
  }, () => {}, true);
}
function renderAlerts() {
  const n = alerts.list.length;
  $('alertPill').style.display = n ? 'block' : 'none';
  $('alertPill').textContent = `🔔 ${n}`;
  if (!n) $('alertBox').style.display = 'none';
  $('alertBox').innerHTML = alerts.list.map(a => `<div class="arow"><span>${esc(a.label)}${a.kind === 'scheduled' ? ` <small class="sched">scheduled ${fmtClock(a.at)}</small>` : ''}</span><button class="tbtn" data-cancel="${a.id}">Cancel</button></div>`).join('') +
    `<div class="muted">Alert me <select id="alertMins">${[2, 5, 10].map(m => `<option value="${m}"${m === saved.alertMins ? ' selected' : ''}>${m} min</option>`).join('')}</select> before. Keep this page open.</div>`;
}
$('alertPill').onclick = () => { const b = $('alertBox'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; };
$('alertBox').addEventListener('click', e => { const id = e.target.closest('[data-cancel]')?.dataset.cancel; if (id) removeAlert(+id); });
$('alertBox').addEventListener('change', e => { if (e.target.id === 'alertMins') { saved.alertMins = +e.target.value; persist(); } });

// --- search boxes with suggestions: fetcher(q) -> [{name, detail, ...}] ---
function setupSearch(input, box, fetcher, onPick, minLen = 3) {
  let t, items = [], active = -1;
  input.addEventListener('input', () => {
    clearTimeout(t);
    const q = input.value.trim();
    if (q.length < minLen) { box.style.display = 'none'; return; }
    t = setTimeout(async () => {
      try {
        items = await fetcher(q);
        if (input.value.trim() !== q) return;
        active = -1;
        box.innerHTML = items.map((it, i) => `<div data-i="${i}">${it.name}<small>${it.detail}</small></div>`).join('') || '<div>No matches</div>';
        box.style.display = 'block';
      } catch { box.style.display = 'none'; }
    }, 250);
  });
  input.addEventListener('keydown', e => {
    const els = box.querySelectorAll('[data-i]');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + els.length) % els.length;
      els.forEach((el, i) => el.classList.toggle('active', i === active)); e.preventDefault();
    } else if (e.key === 'Enter' && items.length) pick(items[Math.max(active, 0)]);
  });
  box.addEventListener('mousedown', e => { const el = e.target.closest('[data-i]'); if (el) pick(items[+el.dataset.i]); });
  input.addEventListener('blur', () => setTimeout(() => box.style.display = 'none', 150));
  input.addEventListener('focus', () => setSheet('full'));
  function pick(it) { input.value = it.name; box.style.display = 'none'; input.blur(); onPick(it); }
}
// places: Photon (OSM), biased to Bengaluru
async function photon(q) {
  const j = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${BLR[0]}&lon=${BLR[1]}&bbox=77.3,12.7,77.95,13.25&limit=6`)).json();
  return j.features.map(f => ({
    name: f.properties.name || f.properties.street || q,
    detail: [f.properties.street, f.properties.district || f.properties.locality, f.properties.city].filter(Boolean).join(', '),
    lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0],
  }));
}
setupSearch($('from'), $('fromSugg'), photon, it => setPoint('from', it.lat, it.lon, it.name));
setupSearch($('to'), $('toSugg'), photon, it => setPoint('to', it.lat, it.lon, it.name));
// routes: Chalo's search by route number
async function routeSearch(q) {
  const list = await (await fetch(`/api/route?q=${encodeURIComponent(q)}`)).json();
  return (Array.isArray(list) ? list : []).map(r => ({ ...r, detail: `${r.from} → ${r.to}${serviceText(r.tags)}` }));
}
setupSearch($('routeQ'), $('routeSugg'), routeSearch, it => { track.pendingFollow = null; openRoute(it.routeId); }, 1);

function setPoint(which, lat, lon, label) {
  state[which] = { lat, lon, label };
  if (label) $(which).value = label;
  drawPins(); renderChips();
  if (state.to && state.from) plan();
  else if (state.to && !state.from) locate(true);
}
function drawPins() {
  layers.pins.clearLayers();
  // GPS start is drawn by the live blue dot (see locate); a typed/clicked start gets a ring marker
  if (state.from && state.from.label !== 'My location') L.marker([state.from.lat, state.from.lon], { icon: startIcon, zIndexOffset: 900 }).bindTooltip('Start').addTo(layers.pins);
  if (state.to) L.marker([state.to.lat, state.to.lon], { icon: destIcon, zIndexOffset: 1000 }).bindTooltip('Destination').addTo(layers.pins);
}

// --- live "you are here" dot, Google Maps style ---
const me = { dot: null, ring: null, watch: null, pos: null, denied: false, flyOnFix: false };
function updateMe(p) {
  const ll = [p.coords.latitude, p.coords.longitude], acc = p.coords.accuracy;
  me.pos = ll; me.denied = false;
  $('meBtn').classList.add('on');
  if (me.flyOnFix) { me.flyOnFix = false; flyToVisible(ll, Math.max(map.getZoom(), 15)); }
  if (mode === 'route') updateMyStop();
  if (mode === 'nearby' && (!near.center || map.distance(near.center, ll) > 400)) startNearby();
  if (!me.dot) {
    me.ring = L.circle(ll, { radius: acc, color: '#4285f4', weight: 1, opacity: .4, fillColor: '#4285f4', fillOpacity: .12, interactive: false }).addTo(map);
    me.dot = L.marker(ll, { icon: meIcon, zIndexOffset: 2000, interactive: false }).addTo(map);
  } else { me.dot.setLatLng(ll); me.ring.setLatLng(ll).setRadius(acc); }
  const f = state.from;
  if (!f || f.label === 'My location') {
    // re-plan only if the fix moved meaningfully (first fixes are often coarse)
    const moved = !f || map.distance(ll, [f.lat, f.lon]) > 250;
    if (moved) setPoint('from', ll[0], ll[1], 'My location');
  }
}
function locate() {
  if (!navigator.geolocation) return setStatus('Location not available. Type a start point.');
  setStatus('Getting your location…', 'loading');
  if (state.from?.label === 'My location' && me.dot) flyToVisible(me.dot.getLatLng(), 15);
  state.from = state.from?.label === 'My location' ? null : state.from;
  if (me.watch != null) navigator.geolocation.clearWatch(me.watch);
  me.watch = navigator.geolocation.watchPosition(updateMe,
    () => setStatus('Couldn\'t get your location. Type a start point above.'),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
}
$('locBtn').onclick = () => locate();
// keep watching position in every tab (doesn't reset a typed start)
function startWatch() {
  if (me.watch != null || !navigator.geolocation) return;
  me.watch = navigator.geolocation.watchPosition(updateMe, () => {
    navigator.geolocation.clearWatch(me.watch); me.denied = true; me.watch = null;
    if (mode === 'nearby') { setStatus('Location is off. Allow it to see buses around you.'); renderNearby(); }
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
}
// Google Maps style "my location" button on the map
L.Control.Me = L.Control.extend({ onAdd() {
  const b = L.DomUtil.create('button', 'map-btn');
  b.id = 'meBtn'; b.title = 'Show my location';
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
  L.DomEvent.disableClickPropagation(b);
  b.onclick = () => { if (me.dot) flyToVisible(me.dot.getLatLng(), Math.max(map.getZoom(), 15)); else { me.flyOnFix = true; startWatch(); } };
  return b;
} });
new L.Control.Me({ position: 'bottomright' }).addTo(map);
const llLabel = ll => `${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`;
let suppressClick = false;
map.on('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  if (mq.matches && sheet.mode === 'full') return setSheet('half');
  if (mode === 'nearby' && near.stack.length) return clearNearSel();
  if (mode !== 'trip') return;
  setPoint(e.originalEvent.shiftKey ? 'from' : 'to', e.latlng.lat, e.latlng.lng, llLabel(e.latlng));
});
// touch: long-press the map to set the start (no shift key on phones; iOS has no contextmenu event)
{
  let lp, sx, sy;
  const mc = map.getContainer();
  mc.addEventListener('touchstart', e => {
    clearTimeout(lp);
    if (e.touches.length !== 1) return;
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    lp = setTimeout(() => {
      if (mode !== 'trip') return;
      const ll = map.containerPointToLatLng(map.mouseEventToContainerPoint(t));
      suppressClick = true; setTimeout(() => suppressClick = false, 800);
      navigator.vibrate?.(20);
      setPoint('from', ll.lat, ll.lng, llLabel(ll));
    }, 550);
  }, { passive: true });
  mc.addEventListener('touchmove', e => { const t = e.touches[0]; if (Math.hypot(t.clientX - sx, t.clientY - sy) > 10) clearTimeout(lp); }, { passive: true });
  mc.addEventListener('touchend', () => clearTimeout(lp));
}

// --- planning ---
function stopTripLive() {
  if (state.es) { state.es.close(); state.es = null; }
  layers.lines.clearLayers(); layers.stops.clearLayers(); layers.buses.clearLayers(); busMarkers.clear(); state.vehicles.clear(); state.etas.clear();
}
async function plan() {
  if (mode !== 'trip') return;
  setStatus('Finding buses…', 'loading');
  stopTripLive();
  try {
    const { from, to } = state;
    const r = await fetch(`/api/plan?flat=${from.lat}&flon=${from.lon}&tlat=${to.lat}&tlon=${to.lon}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    state.routes = data.map((rt, i) => {
      const idx = new Map(rt.stops.map((s, k) => [s.id, k]));
      return { ...rt, color: COLORS[i % COLORS.length], idx, boardIdx: rt.board ? idx.get(rt.board.id) : undefined };
    });
    state.selected = null;
    renderRoutes(); drawRoutes(); connectLive();
    setSheet('half');
    const b = L.latLngBounds([[from.lat, from.lon], [to.lat, to.lon]]).pad(0.25);
    map.fitBounds(b, { paddingBottomRight: [0, mq.matches ? sheet.h : 0] });
  } catch (e) {
    setStatus('Couldn\'t plan this trip: ' + e.message);
    $('routes').innerHTML = '<div class="empty">Something went wrong. Try a different start or destination.</div>';
  }
}

function visibleRoutes() {
  const maxWalk = +$('maxWalk').value;
  return state.routes.filter(r => (!$('onlyDirect').checked || r.direct) && !(r.walkTotal > maxWalk));
}

function renderRoutes() {
  const list = visibleRoutes();
  if (!list.length) {
    $('routes').innerHTML = `<div class="empty">${state.routes.length ? 'No routes match these filters.<br>Try allowing a longer walk.' : 'No bus routes found between these points right now.'}</div>`;
    return;
  }
  $('routes').innerHTML = list.map(r => {
    const buses = busesFor(r);
    const coming = buses.filter(v => !v.passed);
    const rows = buses.sort((a, b) => etaSort(a) - etaSort(b)).slice(0, 8).map(v =>
      `<div class="bus"><span>${v.vNo || 'Bus'}${v.halted ? ' · halted' : ''}</span><span>${busLabel(v)}</span></div>`).join('');
    const next = buses.filter(v => !v.passed && v.etaToStop != null).sort((a, b) => a.etaToStop - b.etaToStop)[0];
    const sel = state.selected === r.routeId, off = state.selected && !sel;
    return `<div class="route${sel ? ' sel' : ''}${off ? ' off' : ''}" data-id="${r.routeId}" style="--rc:${r.color}">
      <div class="rtop"><span class="badge">${r.name}</span>
        ${r.direct ? '<span class="tag direct">DIRECT</span>' : '<span class="tag">TRANSFER</span>'}
        ${r.walkTotal != null ? `<span class="tag walk">${r.walkTotal} min walk</span>` : ''}
        ${r.fare != null ? `<span class="tag fare">₹${r.fare}</span>` : ''}
        ${serviceTags(r.tags, r.name)}
        <span class="live-count">${next ? `next in <b>${fmtEta(next.etaToStop)}</b>` : `<b>${coming.length}</b> coming`}</span></div>
      <div class="rstops">${r.walkToBoard != null ? `Walk ${r.walkToBoard} min to` : 'Board at'} <b>${r.board?.name || '?'}</b><br>Get off at <b>${r.alight?.name || '?'}</b>${r.travelTime ? ` · ~${Math.round(r.travelTime / 60)} min ride` : ''}${r.walkFromAlight ? `, then walk ${r.walkFromAlight} min` : ''}${!r.direct && r.totalFare != null ? `<br>₹${r.totalFare} for the whole trip` : ''}</div>
      <div class="buses">${rows || '<div class="bus"><span>No live buses yet</span><span></span></div>'}
        ${r.board ? `<div class="tacts"><button class="tbtn" data-notify="${r.routeId}">🔔 Notify me before the next bus reaches ${esc(r.board.name)}</button></div>` : ''}</div>
    </div>`;
  }).join('');
}
$('routes').addEventListener('click', e => {
  const n = e.target.closest('[data-notify]');
  if (n) {
    const r = state.routes.find(x => x.routeId === n.dataset.notify);
    return r && addAlert({ kind: 'live', label: `${r.name} at ${r.board.name}`, stopId: r.board.id, routeId: r.routeId, key: null });
  }
  const el = e.target.closest('.route');
  if (!el) return;
  state.selected = state.selected === el.dataset.id ? null : el.dataset.id;
  renderRoutes(); drawRoutes(); redrawBuses();
  const r = state.routes.find(x => x.routeId === state.selected);
  if (r?.board) flyToVisible([r.board.lat, r.board.lon], 14);
});

// --- saved places: chips under "To" ---
function renderChips() {
  const to = state.to, isSaved = to && saved.places.some(p => Math.abs(p.lat - to.lat) < 1e-4 && Math.abs(p.lon - to.lon) < 1e-4);
  $('chips').innerHTML = saved.places.map((p, i) => `<button class="chip" data-place="${i}">${esc(p.name)}<i data-del="${i}" title="Remove">✕</i></button>`).join('') +
    (to && !isSaved ? '<button class="chip add" id="savePlace">☆ Save destination</button>' : '');
}
$('chips').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) { saved.places.splice(+del.dataset.del, 1); persist(); return renderChips(); }
  const c = e.target.closest('[data-place]');
  if (c) { const p = saved.places[+c.dataset.place]; return setPoint('to', p.lat, p.lon, p.name); }
  if (e.target.closest('#savePlace') && state.to) {
    const names = saved.places.map(p => p.name.toLowerCase());
    const guess = !names.includes('home') ? 'Home' : !names.includes('work') ? 'Work' : state.to.label;
    const name = (prompt('Name this place (e.g. Home, Work, College)', guess) || '').trim();
    if (name) { saved.places.push({ name: name.slice(0, 30), lat: state.to.lat, lon: state.to.lon }); persist(); renderChips(); toast(`Saved "${esc(name)}". Tap it any time to plan from where you are.`); }
  }
});

function drawRoutes() {
  layers.lines.clearLayers(); layers.stops.clearLayers();
  for (const r of visibleRoutes()) {
    if (state.selected && state.selected !== r.routeId) continue;
    // only the part of the route you actually ride: boarding stop -> alighting stop
    const a = r.boardIdx, b = r.alight ? r.idx.get(r.alight.id) : undefined;
    const seg = a != null && b != null && b > a ? r.stops.slice(a, b + 1) : [r.board, r.alight].filter(Boolean);
    const pts = seg.map(s => [s.lat, s.lon]);
    if (pts.length > 1) L.polyline(pts, { color: r.color, weight: state.selected ? 5 : 4, opacity: state.selected ? .95 : .7 }).addTo(layers.lines);
    // walking legs: you -> boarding stop, alighting stop -> destination
    const walk = { color: '#cbd5e1', weight: 2, dashArray: '4 6', opacity: .8 };
    if (state.from && r.board) L.polyline([[state.from.lat, state.from.lon], [r.board.lat, r.board.lon]], walk).addTo(layers.lines);
    if (state.to && r.alight) L.polyline([[r.alight.lat, r.alight.lon], [state.to.lat, state.to.lon]], walk).addTo(layers.lines);
    for (const s of [r.board, r.alight].filter(Boolean))
      L.circleMarker([s.lat, s.lon], { radius: 6, color: '#fff', weight: 2, fillColor: r.color, fillOpacity: 1 }).bindTooltip(s.name).addTo(layers.stops);
  }
}

// --- live buses ---
function enrich(v) {
  const r = state.routes.find(x => x.routeId === v.routeId);
  const ni = r?.idx.get(v.nextStop);
  v.passed = r?.boardIdx != null && ni != null && ni > r.boardIdx;
  const e = state.etas.get(v.key);
  v.etaToStop = e && e.etaToStop >= 0 ? e.etaToStop : null;
  if (e && e.etaToStop < 0) v.passed = true;
  if (e && e.etaToStop >= 0) v.passed = false;
  v.stopsAway = r?.boardIdx != null && ni != null && !v.passed ? r.boardIdx - ni : null;
  v.nextStopName = ni != null ? r.stops[ni].name : null;
  return v;
}
function fmtEta(s) {
  if (s == null) return null;
  if (s < 60) return 'arriving now';
  const m = Math.round(s / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
function busLabel(v) {
  if (v.passed) return 'passed your stop';
  const eta = fmtEta(v.etaToStop);
  const stops = v.stopsAway != null ? `${v.stopsAway} stop${v.stopsAway === 1 ? '' : 's'}` : null;
  return [eta, stops].filter(Boolean).join(' · ') || 'en route';
}
const etaSort = v => v.passed ? 1e9 : v.etaToStop ?? (v.stopsAway != null ? 5e8 + v.stopsAway : 9e8);
function busesFor(r) { return [...state.vehicles.values()].filter(v => v.routeId === r.routeId).map(enrich); }

function connectLive() {
  const ids = state.routes.map(r => r.routeId);
  if (!ids.length) return setStatus('No bus routes found');
  // Chalo's live socket (Socket.IO v2). refs: 'routes:<routeId>' = bus positions,
  // 'etas:<stopId>:<routeId>' = seconds until each bus reaches that stop (-1 = passed).
  const refs = state.routes.flatMap(r => ['routes:' + r.routeId, ...(r.board ? [`etas:${r.board.id}:${r.routeId}`] : [])]);
  state.es = liveSocket(refs, (parts, key, d) => {
    if (parts[0] === 'routes' && d._latitude != null) {
      state.vehicles.set(key, { key, routeId: parts[1], vNo: d.vNo, lat: d._latitude, lon: d._longitude, bearing: d.bearing, halted: d._isHalted, nextStop: d.sId, ts: d.tS });
    } else if (parts[0] === 'etas') {
      state.etas.set(key, { key, stopId: parts[1], routeId: parts[2], etaToStop: d.eta, dist: d.dist, ts: d.tS });
    }
  }, () => { redrawBuses(); scheduleRender(); });
}
// Chalo's live socket (Socket.IO v2). Subscribe payloads must be JSON strings; the snapshot's payloads are
// strings and later deltas are objects. `refs` is re-subscribed on every (re)connect, so callers can add to it.
function liveSocket(refs, onData, onBatch, quiet = false) {
  const sock = io('https://crtslb.chalo.com', {
    path: '/products/live/partitions/0', transports: ['websocket'], forceNew: true,

    else mode = order.reduce((a, m) => Math.abs(hs[m] - h) < Math.abs(hs[a] - h) ? m : a);
    drag = null; setSheet(mode);
  };
  side.addEventListener('pointerup', end);
  side.addEventListener('pointercancel', end);
}
mq.addEventListener('change', () => {
  if (mq.matches) setSheet(sheet.mode);
  else { $('side').style.height = ''; $('app').style.removeProperty('--sheet-h'); }
});
addEventListener('resize', () => setSheet(sheet.mode));
document.fonts?.ready.then(() => setSheet(sheet.mode));
if (matchMedia('(pointer: coarse)').matches) $('hint').textContent = 'Tip: tap the map to set the destination, long-press to set the start.';
setSheet('peek');

const hashRoute = location.hash.match(/route=([\w-]+)/)?.[1];
if (hashRoute) { track.route = { routeId: hashRoute }; setMode('route'); }
startWatch(); // show where you are from the start, in every tab
renderChips();
</script>
</body>
</html>
